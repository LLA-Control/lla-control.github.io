<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLA Control — Look Back, Look Ahead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e0f12; --text-dim: #8f929a; --mpc-soft: #BF80CD; --mppi-soft: #34AA78; --cbf-soft: #529BE3; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text-dim);
    font-family: "Space Grotesk", "Inter", -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 24px;
  }
  h1 {
    margin: 0; font-weight: 700; font-size: clamp(40px, 7vw, 64px); letter-spacing: -0.02em; line-height: 1.15;
    background: linear-gradient(90deg, var(--mpc-soft), var(--cbf-soft) 52%, var(--mppi-soft));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 .pair { white-space: nowrap; }
  p { margin: 18px 0 0; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 15px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<main>
  <h1>Look Back, <span class="pair">Look Ahead</span></h1>
  <p>coming soon</p>
</main>
</body>
</html>
